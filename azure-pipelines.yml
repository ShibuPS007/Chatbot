trigger:
  branches:
    include:
      - feature/*

pr: none

pool:
  vmImage: ubuntu-latest

variables:
- name: pythonVersion
  value: "3.12"

steps:
- checkout: self

- task: UsePythonVersion@0
  displayName: Use Python
  inputs:
    versionSpec: $(pythonVersion)

- task: Bash@3
  displayName: Install Dependencies
  inputs:
    targetType: inline
    script: |
      python -m pip install --upgrade pip
      pip install -r backend/requirements.txt
      pip install pytest pytest-mock
      pip install ruff black

- task: Bash@3
  displayName: Ruff Check
  inputs:
    targetType: inline
    script: |
      ruff check . --ignore F401

- task: Bash@3
  displayName: Black Check
  inputs:
    targetType: inline
    script: |
      black --check .

- task: Bash@3
  displayName: Debug SECRET_KEY
  inputs:
    targetType: inline
    script: |
      echo "SECRET_KEY=[$SECRET_KEY]"
      env | grep SECRET || true

      python - <<EOF
      import os
      print("Python SECRET_KEY:", repr(os.getenv("SECRET_KEY")))
      EOF
  env:
    SECRET_KEY: my-temporary-ci-secret-key
- task: Bash@3
  displayName: Debug Python Env
  inputs:
    targetType: inline
    script: |
      python - <<EOF
      import os
      print("SECRET_KEY =", repr(os.getenv("SECRET_KEY")))
      EOF
  env:
    SECRET_KEY: my-temporary-ci-secret-key
- task: Bash@3
  displayName: Run Tests
  inputs:
    targetType: inline
    script: |
      pytest backend/tests \
        --ignore=backend/tests/test_integration.py
  env:
    SECRET_KEY: my-temporary-ci-secret-key