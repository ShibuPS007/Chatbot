trigger:
  branches:
    include:
      - feature/*

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - name: pythonVersion
    value: "3.12"
  - name: SECRET_KEY
    value: "my-temporary-ci-secret-key"

steps:
- checkout: self

- task: UsePythonVersion@0
  displayName: Use Python
  inputs:
    versionSpec: $(pythonVersion)

- task: Bash@3
  displayName: Install Dependencies
  inputs:
    targetType: inline
    script: |
      python -m pip install --upgrade pip
      pip install -r backend/requirements.txt
      pip install pytest pytest-mock
      pip install ruff black

- task: Bash@3
  displayName: Ruff Check
  inputs:
    targetType: inline
    script: |
      ruff check . --ignore F401

- task: Bash@3
  displayName: Black Check
  inputs:
    targetType: inline
    script: |
      black --check .

- task: Bash@3
  displayName: Check SECRET_KEY
  inputs:
    targetType: inline
    script: |
      echo "Pipeline YAML version: v2"
      echo "Length of SECRET_KEY: ${#SECRET_KEY}"
      echo "Value or fallback: ${SECRET_KEY:-EMPTY_OR_UNSET}"

      if [ -z "$SECRET_KEY" ]; then
        echo "SECRET_KEY is NOT SET"
        exit 1
      else
        echo "SECRET_KEY is SET"
      fi
  env:
    SECRET_KEY: $(SECRET_KEY)

- task: Bash@3
  displayName: Run Tests
  inputs:
    targetType: inline
    script: |
      pytest backend/tests \
        --ignore=backend/tests/test_integration.py
  env:
    SECRET_KEY: $(SECRET_KEY)
    PYTHONPATH: $(System.DefaultWorkingDirectory)